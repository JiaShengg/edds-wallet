<!-- @dsCard group="Colors" viewport="700x150" name="Tints" subtitle="Derived washes for icon tiles, badges and banners" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0}body{width:700px;height:150px;padding:20px;box-sizing:border-box;background:var(--color-bg);font-family:var(--font-body);color:var(--color-text);overflow:hidden}
.g{display:grid;gap:12px}.sw{border-radius:var(--radius-md);height:76px;display:flex;flex-direction:column;justify-content:flex-end;padding:10px;box-sizing:border-box}
.n{font-size:11px;font-weight:700;line-height:1.3}.h{font-size:10px;font-family:var(--font-body);opacity:.85;letter-spacing:.04em}
.cap{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--color-muted)}</style></head><body><div class="g" style="grid-template-columns:repeat(7,1fr)">
<div class="sw" style="background:#FFE3F0;color:#4A2A55"><span class="n">primary</span><span class="h">#FFE3F0</span></div><div class="sw" style="background:#EBE5FF;color:#4A2A55"><span class="n">secondary</span><span class="h">#EBE5FF</span></div><div class="sw" style="background:#D6FBF4;color:#4A2A55"><span class="n">accent</span><span class="h">#D6FBF4</span></div><div class="sw" style="background:#DFF8EC;color:#4A2A55"><span class="n">success</span><span class="h">#DFF8EC</span></div><div class="sw" style="background:#FFF3D2;color:#4A2A55"><span class="n">warning</span><span class="h">#FFF3D2</span></div><div class="sw" style="background:#FFE3E3;color:#4A2A55"><span class="n">error</span><span class="h">#FFE3E3</span></div><div class="sw" style="background:#E3F0FF;color:#4A2A55"><span class="n">info</span><span class="h">#E3F0FF</span></div>
</div></body></html>
