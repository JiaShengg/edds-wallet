<!-- @dsCard group="Colors" viewport="700x150" name="Gradients" subtitle="Two gradients only — the app-icon brand ramp and the playful pink→purple" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0}body{width:700px;height:150px;padding:20px;box-sizing:border-box;background:var(--color-bg);font-family:var(--font-body);color:var(--color-text);overflow:hidden}
.g{display:grid;gap:12px}.sw{border-radius:var(--radius-md);height:76px;display:flex;flex-direction:column;justify-content:flex-end;padding:10px;box-sizing:border-box}
.n{font-size:11px;font-weight:700;line-height:1.3}.h{font-size:10px;font-family:var(--font-body);opacity:.85;letter-spacing:.04em}
.cap{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--color-muted)}</style></head><body><div class="g" style="grid-template-columns:repeat(2,1fr)">
<div class="sw" style="background:var(--gradient-brand);color:#fff;height:100px"><span class="n">--gradient-brand</span><span class="h">135°, #FF9DC4 → #FF5DA2 · app icon, kid balance hero</span></div>
<div class="sw" style="background:var(--gradient-play);color:#fff;height:100px"><span class="n">--gradient-play</span><span class="h">135°, #FF5DA2 → #7C5CFF · celebratory moments</span></div>
</div></body></html>
