<!-- @dsCard group="Spacing" viewport="700x210" name="Density in use" subtitle="Parent rows are 12/16; kid rows are 16/20 with 56px tap targets" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0}body{width:700px;height:210px;padding:20px;box-sizing:border-box;background:var(--color-bg);font-family:var(--font-body);color:var(--color-text);overflow:hidden}
.g{display:grid;gap:12px}.sw{border-radius:var(--radius-md);height:76px;display:flex;flex-direction:column;justify-content:flex-end;padding:10px;box-sizing:border-box}
.n{font-size:11px;font-weight:700;line-height:1.3}.h{font-size:10px;font-family:var(--font-body);opacity:.85;letter-spacing:.04em}
.cap{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--color-muted)}</style></head><body><div style="display:grid;grid-template-columns:1fr 1fr;gap:16px">
<div style="background:var(--color-surface);border:1px solid var(--color-hairline);border-radius:var(--radius-lg);padding:16px">
<div style="font-size:11px;font-weight:700;color:var(--color-muted);margin-bottom:8px">PARENT · pad 16 / gap 12</div>
<div style="display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--color-hairline)"><span style="width:40px;height:40px;border-radius:10px;background:var(--color-primary-tint)"></span><span style="height:10px;flex:1;background:var(--color-surface-sunken);border-radius:5px"></span></div><div style="display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--color-hairline)"><span style="width:40px;height:40px;border-radius:10px;background:var(--color-primary-tint)"></span><span style="height:10px;flex:1;background:var(--color-surface-sunken);border-radius:5px"></span></div><div style="display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--color-hairline)"><span style="width:40px;height:40px;border-radius:10px;background:var(--color-primary-tint)"></span><span style="height:10px;flex:1;background:var(--color-surface-sunken);border-radius:5px"></span></div>
</div>
<div style="background:var(--color-surface);border:1px solid var(--color-hairline);border-radius:var(--radius-lg);padding:20px">
<div style="font-size:11px;font-weight:700;color:var(--color-muted);margin-bottom:12px">CHILD · pad 20 / gap 16 / tap 56</div>
<div style="display:flex;gap:16px;align-items:center;height:56px;margin-bottom:16px"><span style="width:52px;height:52px;border-radius:16px;background:var(--color-accent-tint)"></span><span style="height:14px;flex:1;background:var(--color-surface-sunken);border-radius:7px"></span></div><div style="display:flex;gap:16px;align-items:center;height:56px;margin-bottom:16px"><span style="width:52px;height:52px;border-radius:16px;background:var(--color-accent-tint)"></span><span style="height:14px;flex:1;background:var(--color-surface-sunken);border-radius:7px"></span></div>
</div></div></body></html>
