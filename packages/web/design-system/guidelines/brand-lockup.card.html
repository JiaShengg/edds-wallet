<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0}body{width:700px;height:150px;padding:20px;box-sizing:border-box;background:var(--color-bg);font-family:var(--font-body);color:var(--color-text);overflow:hidden}
.g{display:grid;gap:12px}.sw{border-radius:var(--radius-md);height:76px;display:flex;flex-direction:column;justify-content:flex-end;padding:10px;box-sizing:border-box}
.n{font-size:11px;font-weight:700;line-height:1.3}.h{font-size:10px;font-family:var(--font-body);opacity:.85;letter-spacing:.04em}
.cap{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--color-muted)}</style></head><body><div style="display:flex;flex-direction:column;gap:18px">
<span style="display:inline-flex;align-items:center;gap:12px"><img src="../assets/logo.svg" width="44" height="44" style="border-radius:24%" alt=""><span style="font-family:var(--font-display);font-size:26px;font-weight:700">Edd's Wallet</span></span>
<span style="display:inline-flex;align-items:center;gap:12px;background:var(--color-primary);border-radius:var(--radius-pill);padding:8px 18px 8px 8px"><img src="../assets/piggy-mark.svg" width="32" height="32" alt=""><span style="font-family:var(--font-display);font-size:20px;font-weight:700;color:#fff">Edd's Wallet</span></span>
</div></body></html>
