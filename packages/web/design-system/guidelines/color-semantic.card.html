<!-- @dsCard group="Colors" viewport="700x150" name="Semantic" subtitle="Success, warning (paused rules), error (insufficient balance), info" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0}body{width:700px;height:150px;padding:20px;box-sizing:border-box;background:var(--color-bg);font-family:var(--font-body);color:var(--color-text);overflow:hidden}
.g{display:grid;gap:12px}.sw{border-radius:var(--radius-md);height:76px;display:flex;flex-direction:column;justify-content:flex-end;padding:10px;box-sizing:border-box}
.n{font-size:11px;font-weight:700;line-height:1.3}.h{font-size:10px;font-family:var(--font-body);opacity:.85;letter-spacing:.04em}
.cap{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--color-muted)}</style></head><body><div class="g" style="grid-template-columns:repeat(4,1fr)">
<div class="sw" style="background:#3DDC97;color:#0F5E3E"><span class="n">--color-success</span><span class="h">#3DDC97</span></div><div class="sw" style="background:#FFC93C;color:#6B4A00"><span class="n">--color-warning</span><span class="h">#FFC93C</span></div><div class="sw" style="background:#FF5D5D;color:#fff"><span class="n">--color-error</span><span class="h">#FF5D5D</span></div><div class="sw" style="background:#5DA9FF;color:#123E6B"><span class="n">--color-info</span><span class="h">#5DA9FF</span></div>
</div></body></html>
