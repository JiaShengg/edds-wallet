<!-- @dsCard group="Type" viewport="700x200" name="Pairing in use" subtitle="Fredoka headline over Quicksand copy — never the reverse" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0}body{width:700px;height:200px;padding:20px;box-sizing:border-box;background:var(--color-bg);font-family:var(--font-body);color:var(--color-text);overflow:hidden}
.g{display:grid;gap:12px}.sw{border-radius:var(--radius-md);height:76px;display:flex;flex-direction:column;justify-content:flex-end;padding:10px;box-sizing:border-box}
.n{font-size:11px;font-weight:700;line-height:1.3}.h{font-size:10px;font-family:var(--font-body);opacity:.85;letter-spacing:.04em}
.cap{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--color-muted)}</style></head><body><div style="background:var(--color-surface);border:1px solid var(--color-hairline);border-radius:var(--radius-lg);box-shadow:var(--shadow-card);padding:20px">
<h3 style="font-family:var(--font-display);font-size:30px;font-weight:700;margin:0 0 6px">Next allowance</h3>
<p style="font-family:var(--font-body);font-size:16px;font-weight:500;margin:0;color:var(--color-text);max-width:52ch;line-height:1.5">Money shows up on Monday. Nothing to do — it just arrives.</p>
<p style="font-family:var(--font-body);font-size:14px;margin:10px 0 0;color:var(--color-muted)">Fredoka for the moment, Quicksand for the explanation.</p>
</div></body></html>
