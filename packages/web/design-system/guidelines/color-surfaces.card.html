<!-- @dsCard group="Colors" viewport="700x150" name="Surfaces & ink" subtitle="Page, card, sunken wash, text and muted text" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0}body{width:700px;height:150px;padding:20px;box-sizing:border-box;background:var(--color-bg);font-family:var(--font-body);color:var(--color-text);overflow:hidden}
.g{display:grid;gap:12px}.sw{border-radius:var(--radius-md);height:76px;display:flex;flex-direction:column;justify-content:flex-end;padding:10px;box-sizing:border-box}
.n{font-size:11px;font-weight:700;line-height:1.3}.h{font-size:10px;font-family:var(--font-body);opacity:.85;letter-spacing:.04em}
.cap{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--color-muted)}</style></head><body><div class="g" style="grid-template-columns:repeat(5,1fr)">
<div class="sw" style="background:#FFF5FB;color:#4A2A55"><span class="n">--color-bg</span><span class="h">#FFF5FB</span></div><div class="sw" style="background:#FFFFFF;color:#4A2A55"><span class="n">--color-surface</span><span class="h">#FFFFFF</span></div><div class="sw" style="background:#FBEFF7;color:#4A2A55"><span class="n">--color-surface-sunken</span><span class="h">#FBEFF7</span></div><div class="sw" style="background:#4A2A55;color:#fff"><span class="n">--color-text</span><span class="h">#4A2A55</span></div><div class="sw" style="background:#9A7FB0;color:#fff"><span class="n">--color-muted</span><span class="h">#9A7FB0</span></div>
</div></body></html>
