<!-- @dsCard group="Spacing" viewport="700x190" name="Shadows" subtitle="Purple-tinted soft shadows; blur grows with elevation, never the opacity of black" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0}body{width:700px;height:190px;padding:20px;box-sizing:border-box;background:var(--color-bg);font-family:var(--font-body);color:var(--color-text);overflow:hidden}
.g{display:grid;gap:12px}.sw{border-radius:var(--radius-md);height:76px;display:flex;flex-direction:column;justify-content:flex-end;padding:10px;box-sizing:border-box}
.n{font-size:11px;font-weight:700;line-height:1.3}.h{font-size:10px;font-family:var(--font-body);opacity:.85;letter-spacing:.04em}
.cap{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--color-muted)}</style></head><body><div style="display:flex;gap:18px;align-items:center">
<div style="text-align:center;flex:1"><div style="height:80px;background:var(--color-surface);border-radius:var(--radius-lg);box-shadow:var(--shadow-card)"></div><div style="font-size:11px;font-weight:700;margin-top:10px">--shadow-card</div><div style="font-size:10px;color:var(--color-muted)">0 6px 20px /8%</div></div><div style="text-align:center;flex:1"><div style="height:80px;background:var(--color-surface);border-radius:var(--radius-lg);box-shadow:var(--shadow-raised)"></div><div style="font-size:11px;font-weight:700;margin-top:10px">--shadow-raised</div><div style="font-size:10px;color:var(--color-muted)">0 12px 32px /12%</div></div><div style="text-align:center;flex:1"><div style="height:80px;background:var(--color-surface);border-radius:var(--radius-lg);box-shadow:var(--shadow-modal)"></div><div style="font-size:11px;font-weight:700;margin-top:10px">--shadow-modal</div><div style="font-size:10px;color:var(--color-muted)">0 24px 64px /24%</div></div><div style="text-align:center;flex:1"><div style="height:80px;background:var(--color-surface);border-radius:var(--radius-lg);box-shadow:var(--shadow-inset)"></div><div style="font-size:11px;font-weight:700;margin-top:10px">--shadow-inset</div><div style="font-size:10px;color:var(--color-muted)">inset 0 2px 6px /8%</div></div>
</div></body></html>
