<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0}body{width:700px;height:150px;padding:20px;box-sizing:border-box;background:var(--color-bg);font-family:var(--font-body);color:var(--color-text);overflow:hidden}
.g{display:grid;gap:12px}.sw{border-radius:var(--radius-md);height:76px;display:flex;flex-direction:column;justify-content:flex-end;padding:10px;box-sizing:border-box}
.n{font-size:11px;font-weight:700;line-height:1.3}.h{font-size:10px;font-family:var(--font-body);opacity:.85;letter-spacing:.04em}
.cap{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--color-muted)}</style></head><body><div class="g" style="grid-template-columns:repeat(4,1fr)">
<div class="sw" style="background:#FF5DA2;color:#fff"><span class="n">--color-primary</span><span class="h">#FF5DA2</span></div><div class="sw" style="background:#D93E82;color:#fff"><span class="n">--color-primary-dark</span><span class="h">#D93E82</span></div><div class="sw" style="background:#7C5CFF;color:#fff"><span class="n">--color-secondary</span><span class="h">#7C5CFF</span></div><div class="sw" style="background:#2FE6C9;color:#0C4F45"><span class="n">--color-accent</span><span class="h">#2FE6C9</span></div>
</div></body></html>
