<!-- @dsCard group="Spacing" viewport="700x170" name="Corner radii" subtitle="Chunky by default — 16 for rows, 22 for cards, 28 for modals and heroes" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0}body{width:700px;height:170px;padding:20px;box-sizing:border-box;background:var(--color-bg);font-family:var(--font-body);color:var(--color-text);overflow:hidden}
.g{display:grid;gap:12px}.sw{border-radius:var(--radius-md);height:76px;display:flex;flex-direction:column;justify-content:flex-end;padding:10px;box-sizing:border-box}
.n{font-size:11px;font-weight:700;line-height:1.3}.h{font-size:10px;font-family:var(--font-body);opacity:.85;letter-spacing:.04em}
.cap{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--color-muted)}</style></head><body><div style="display:flex;gap:14px;align-items:flex-end">
<div style="text-align:center"><div style="width:104px;height:76px;background:var(--color-surface);border:2px solid var(--color-primary);border-radius:10px"></div><div style="font-size:11px;font-weight:700;margin-top:6px">--radius-sm</div><div style="font-size:10px;color:var(--color-muted)">10px</div></div><div style="text-align:center"><div style="width:104px;height:76px;background:var(--color-surface);border:2px solid var(--color-primary);border-radius:16px"></div><div style="font-size:11px;font-weight:700;margin-top:6px">--radius-md</div><div style="font-size:10px;color:var(--color-muted)">16px</div></div><div style="text-align:center"><div style="width:104px;height:76px;background:var(--color-surface);border:2px solid var(--color-primary);border-radius:22px"></div><div style="font-size:11px;font-weight:700;margin-top:6px">--radius-lg</div><div style="font-size:10px;color:var(--color-muted)">22px</div></div><div style="text-align:center"><div style="width:104px;height:76px;background:var(--color-surface);border:2px solid var(--color-primary);border-radius:28px"></div><div style="font-size:11px;font-weight:700;margin-top:6px">--radius-xl</div><div style="font-size:10px;color:var(--color-muted)">28px</div></div><div style="text-align:center"><div style="width:104px;height:76px;background:var(--color-surface);border:2px solid var(--color-primary);border-radius:999px"></div><div style="font-size:11px;font-weight:700;margin-top:6px">--radius-pill</div><div style="font-size:10px;color:var(--color-muted)">999px</div></div>
<div style="text-align:center"><div style="width:76px;height:76px;background:var(--gradient-brand);border-radius:24%"></div><div style="font-size:11px;font-weight:700;margin-top:6px">squircle</div><div style="font-size:10px;color:var(--color-muted)">24% · icon</div></div>
</div></body></html>
