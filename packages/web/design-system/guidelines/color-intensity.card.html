<!-- @dsCard group="Colors" viewport="700x190" name="Parent vs child intensity" subtitle="Kid surfaces run bright; dense parent surfaces stay on background, surface and muted" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0}body{width:700px;height:190px;padding:20px;box-sizing:border-box;background:var(--color-bg);font-family:var(--font-body);color:var(--color-text);overflow:hidden}
.g{display:grid;gap:12px}.sw{border-radius:var(--radius-md);height:76px;display:flex;flex-direction:column;justify-content:flex-end;padding:10px;box-sizing:border-box}
.n{font-size:11px;font-weight:700;line-height:1.3}.h{font-size:10px;font-family:var(--font-body);opacity:.85;letter-spacing:.04em}
.cap{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--color-muted)}</style></head><body><div class="g" style="grid-template-columns:1fr 1fr;align-items:stretch">
<div style="background:var(--gradient-brand);color:#fff;border-radius:var(--radius-lg);padding:16px">
<div style="font-size:12px;font-weight:700;opacity:.9">Child view</div>
<div style="font-family:var(--font-display);font-size:40px;font-weight:700;line-height:1.05">$42.50</div>
<div style="font-size:12px;opacity:.9">Full-intensity gradient, big Fredoka figure</div></div>
<div style="background:var(--color-surface);border:1px solid var(--color-hairline);border-radius:var(--radius-lg);padding:16px;box-shadow:var(--shadow-card)">
<div style="font-size:12px;font-weight:700;color:var(--color-muted)">Parent view</div>
<div style="font-family:var(--font-display);font-size:30px;font-weight:700">$42.50</div>
<div style="font-size:12px;color:var(--color-muted)">White surface, muted labels, accents used sparingly</div></div>
</div></body></html>
