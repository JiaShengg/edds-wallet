<!-- @dsCard group="Spacing" viewport="700x180" name="Pressable edge" subtitle="Buttons sit on a solid 4px bottom edge that collapses on press" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0}body{width:700px;height:180px;padding:20px;box-sizing:border-box;background:var(--color-bg);font-family:var(--font-body);color:var(--color-text);overflow:hidden}
.g{display:grid;gap:12px}.sw{border-radius:var(--radius-md);height:76px;display:flex;flex-direction:column;justify-content:flex-end;padding:10px;box-sizing:border-box}
.n{font-size:11px;font-weight:700;line-height:1.3}.h{font-size:10px;font-family:var(--font-body);opacity:.85;letter-spacing:.04em}
.cap{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--color-muted)}</style></head><body><div style="display:flex;gap:24px;align-items:center">
<div style="text-align:center"><div style="display:inline-flex;align-items:center;justify-content:center;height:56px;padding:0 24px;border-radius:var(--radius-lg);background:var(--color-primary);color:#fff;font-family:var(--font-display);font-weight:600;font-size:16px;box-shadow:var(--edge-primary)">Add money</div><div style="font-size:11px;color:var(--color-muted);margin-top:14px">rest · --edge-primary</div></div>
<div style="text-align:center"><div style="display:inline-flex;align-items:center;justify-content:center;height:56px;padding:0 24px;border-radius:var(--radius-lg);background:var(--color-primary);color:#fff;font-family:var(--font-display);font-weight:600;font-size:16px;transform:translateY(2px)">Add money</div><div style="font-size:11px;color:var(--color-muted);margin-top:14px">pressed · edge removed, +2px y</div></div>
<div style="text-align:center"><div style="display:inline-flex;align-items:center;justify-content:center;height:56px;padding:0 24px;border-radius:var(--radius-lg);background:var(--color-surface);color:var(--color-text);border:2px solid var(--color-hairline);font-family:var(--font-display);font-weight:600;font-size:16px;box-shadow:var(--edge-neutral)">Edit</div><div style="font-size:11px;color:var(--color-muted);margin-top:14px">quiet · --edge-neutral</div></div>
</div></body></html>
